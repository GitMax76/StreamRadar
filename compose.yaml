name: streamsuite
services:
  gateway:
    build: ./gateway
    init: true
    restart: unless-stopped
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-8790}:8080"
    environment:
      RADAR_ORIGIN: http://radar:8080
      MANAGER_ORIGIN: http://manager:8097
    depends_on:
      - radar
      - manager
  radar:
    build: ./radar
    init: true
    restart: unless-stopped
    environment:
      TMDB_READ_TOKEN: "${TMDB_READ_TOKEN:-}"
      STREAMING_API_KEY: "${STREAMING_API_KEY:-}"
      OMDB_API_KEY: "${OMDB_API_KEY:-}"
  manager:
    build: ./manager
    init: true
    restart: unless-stopped
    environment:
      LSM_PASSWORD: "${LSM_PASSWORD:?Imposta LSM_PASSWORD nel file .env}"
    volumes:
      - type: bind
        source: "${LSM_DATA_PATH:-./downloads}"
        target: /data
        bind:
          create_host_path: false
    security_opt:
      - no-new-privileges:true
